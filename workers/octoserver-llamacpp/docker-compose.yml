services:
  octofan-controller:
    build: .
    container_name: octofan-controller
    privileged: true
    gpus: all
    restart: unless-stopped
    environment:
      OCTOFAN_CONFIG: /config/octofan.yaml
      OCTOFAN_BIN: /opt/octofan/fan_controller_cli
      # Set to "1" to try the stack without Octofan USB hardware.
      OCTOFAN_MOCK: "${OCTOFAN_MOCK:-0}"
    volumes:
      - ./config:/config
      - /dev/bus/usb:/dev/bus/usb
      - /etc/hostname:/host/etc/hostname:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${OCTOFAN_CONTROLLER_PORT:-8000}:8000"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: octofan-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - octofan-controller
      - node-exporter

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    container_name: octofan-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave

  grafana:
    image: grafana/grafana:11.4.0
    container_name: octofan-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: octofan
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

  # ARQUITECTURA v7 (2026-07-06): vuelta a llama.cpp puro (server binario, sin RPC, sin
  # Ollama, sin vLLM), un contenedor por GPU. Reemplaza tanto el intento anterior con
  # vLLM (v6) como el intento intermedio con Ollama (probado y descartado el mismo dia:
  # bug de finish_reason en streaming del provider ollama_chat de litellm, y el modelo
  # de reemplazo -- gemma-4-abliterated -- no tenia fine-tune de codigo). Imagen
  # ${*_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda} SIN pin de version: el bug de CUDA
  # en MoE que forzaba pinear a b8857 (`MUL_MAT_ID failed`, ggml-org/llama.cpp#24937) no
  # se reprodujo en el build actual (b9879) con el mismo modelo abliterated -- se
  # confirmo con varios requests secuenciales reales sin crash. --no-mmap en los tres:
  # el host tiene solo 7.4GB RAM, no se puede depender del page cache para GGUF de
  # hasta 18GB.
  llamacpp-qwen3coder:
    image: ${QWEN3CODER_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    container_name: octofan-llamacpp-qwen3coder
    restart: unless-stopped
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --alias
      - ${QWEN3CODER_ALIAS:-qwen3coder:30b}
      - --model
      - /models/${QWEN3CODER_MODEL:-Huihui-Qwen3-Coder-30B-A3B-Instruct-abliterated.i1-IQ4_XS.gguf}
      - --ctx-size
      - ${QWEN3CODER_CTX_SIZE:-65536}
      - --n-gpu-layers
      - ${QWEN3CODER_N_GPU_LAYERS:-999}
      - --parallel
      - ${QWEN3CODER_PARALLEL:-1}
      - --batch-size
      - ${QWEN3CODER_BATCH_SIZE:-512}
      - --ubatch-size
      - ${QWEN3CODER_UBATCH_SIZE:-128}
      - --no-mmap
    volumes:
      - ${MODELS_DIR:-/opt/llamacpp/models}:/models:ro
    ports:
      - "${QWEN3CODER_PORT:-8080}:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${QWEN3CODER_GPU:-0}"]
              capabilities: [gpu]

  llamacpp-qwen36-uncensored:
    # LLAMA_ARG_CHAT_TEMPLATE_KWARGS (2026-07-06, fix): el nombre de env var correcto
    # sigue la convencion LLAMA_ARG_<FLAG_EN_MAYUSCULAS> de llama.cpp -- confirmado con
    # `llama-server --help`, que documenta "(env: LLAMA_ARG_CHAT_TEMPLATE_KWARGS)" para
    # --chat-template-kwargs. Antes decia LLAMA_CHAT_TEMPLATE_KWARGS (sin ARG_), que
    # llama.cpp ignora silenciosamente -- el thinking quedaba activo pese a la intencion
    # de desactivarlo, y ensuciaba las respuestas a OpenCode con reasoning_content.
    image: ${QWEN36_UNCENSORED_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    container_name: octofan-llamacpp-qwen36-uncensored
    restart: unless-stopped
    environment:
      LLAMA_ARG_CHAT_TEMPLATE_KWARGS: '{"enable_thinking":false}'
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --alias
      - ${QWEN36_UNCENSORED_ALIAS:-qwen3.6:35b}
      - --model
      - /models/${QWEN36_UNCENSORED_MODEL:-qwen3.6-uncensored.gguf}
      - --ctx-size
      - ${QWEN36_UNCENSORED_CTX_SIZE:-65536}
      - --n-gpu-layers
      - ${QWEN36_UNCENSORED_N_GPU_LAYERS:-999}
      - --parallel
      - ${QWEN36_UNCENSORED_PARALLEL:-1}
      - --batch-size
      - ${QWEN36_UNCENSORED_BATCH_SIZE:-512}
      - --ubatch-size
      - ${QWEN36_UNCENSORED_UBATCH_SIZE:-128}
      - --no-mmap
    volumes:
      - ${MODELS_DIR:-/opt/llamacpp/models}:/models:ro
    ports:
      - "${QWEN36_UNCENSORED_PORT:-8081}:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${QWEN36_UNCENSORED_GPU:-1}"]
              capabilities: [gpu]

  # Vuelto al fine-tune comunitario "Llama-3.1-Pro-Coder-v1" (sin AWQ/safetensors
  # disponible) al volver de vLLM a llama.cpp puro en la v7 -- ya no aplica la
  # justificacion de la v6 de usar el AWQ oficial de Meta (esa migracion dependia de
  # vLLM, que se dio de baja de nuevo).
  #
  # Ctx subido de 8192 a 49152 (2026-07-19): maximo empirico que entra en la 3060 12GB
  # sin OOM (probado con un request real de ~42K tokens, VRAM ~10.7GB/12.3GB, ~1.5GB de
  # margen). Motivo: pasa a ser tambien el destino del redirect del clasificador de
  # permisos de auto-mode (ver gateway/callbacks.py) -- reemplaza a qwen3.6:35b, que
  # puntuaba severity ~10x mas alto que Sonnet real para el mismo contenido. Si el
  # request no entra ni en 49152, litellm cae a claude-sonnet-5 real via
  # context_window_fallbacks (gateway/litellm-config.yaml), no falla ni se degrada la
  # decision de seguridad.
  llamacpp-llama31-pro:
    image: ${LLAMA31_PRO_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    container_name: octofan-llamacpp-llama31-pro
    restart: unless-stopped
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --alias
      - ${LLAMA31_PRO_ALIAS:-llama3.1:8b}
      - --model
      - /models/${LLAMA31_PRO_MODEL:-llama31-pro.gguf}
      - --ctx-size
      - ${LLAMA31_PRO_CTX_SIZE:-49152}
      - --n-gpu-layers
      - ${LLAMA31_PRO_N_GPU_LAYERS:-999}
      - --parallel
      - ${LLAMA31_PRO_PARALLEL:-1}
      - --batch-size
      - ${LLAMA31_PRO_BATCH_SIZE:-512}
      - --ubatch-size
      - ${LLAMA31_PRO_UBATCH_SIZE:-128}
      - --no-mmap
    volumes:
      - ${MODELS_DIR:-/opt/llamacpp/models}:/models:ro
    ports:
      - "${LLAMA31_PRO_PORT:-8082}:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LLAMA31_PRO_GPU:-2}"]
              capabilities: [gpu]

  # Clasificador de riesgo dedicado para el permission-classifier de auto-mode de
  # Claude Code (ver gateway/callbacks.py). Historia corta: 4 intentos previos fallaron
  # -- qwen3.6:35b/qwen3-coder:30b/llama3.1:8b con el prompt original de Anthropic
  # (severity ~10x mas alto que Sonnet, o sin discriminar nada) y Llama Guard 3 8B (el
  # clasificador de seguridad dedicado de Meta) con una taxonomia propia inyectada, que
  # mejoro el recall pero seguia con falsos positivos en operaciones rutinarias (git
  # push normal, DELETE con WHERE) porque su entrenamiento es de moderacion de
  # CONTENIDO conversacional, no de riesgo operativo de comandos.
  #
  # Lo que SI funciono (2026-07-19): un modelo de CODIGO (qwen3-coder:30b, probado en
  # GPU0 antes de traerlo aca) con una taxonomia propia de riesgo devops + ejemplos
  # trabajados por categoria (no alcanza con la regla en texto sola -- el modelo
  # necesita ver el par contraste explicito, ej. "DELETE FROM x;" vs "DELETE FROM x
  # WHERE y;", para aplicar la condicion calificante en vez de alucinar/pattern-matchear
  # el verbo solo). 14/14 en el set de prueba de control. Ver gateway/callbacks.py para
  # el prompt completo y el mapeo safe/unsafe+categoria -> <severity>/<category>.
  #
  # Qwen2.5-Coder-7B-Instruct (variante -128K de unsloth, rope scaling ya horneado en el
  # GGUF) en vez de reusar qwen3-coder:30b de GPU0 -- esa GPU se reserva para coding real,
  # no se quiere competir por sus slots. GPU3, la ultima libre. Cache K/V en q8_0 (con
  # flash-attn) para contexto grande con margen holgado: este modelo es mucho mas chico
  # (7B, GQA de 4 kv-heads) que los de 8B que veniamos usando, el KV cache pesa una
  # fraccion de lo que pesaria en llama31-pro/llama-guard para el mismo contexto.
  llamacpp-permission-classifier:
    image: ${PERMISSION_CLASSIFIER_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    container_name: octofan-llamacpp-permission-classifier
    restart: unless-stopped
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --alias
      - ${PERMISSION_CLASSIFIER_ALIAS:-qwen2.5-coder:7b}
      - --model
      - /models/${PERMISSION_CLASSIFIER_MODEL:-Qwen2.5-Coder-7B-Instruct-128K-Q4_K_M.gguf}
      - --ctx-size
      - ${PERMISSION_CLASSIFIER_CTX_SIZE:-131072}
      - --n-gpu-layers
      - ${PERMISSION_CLASSIFIER_N_GPU_LAYERS:-999}
      - --parallel
      - ${PERMISSION_CLASSIFIER_PARALLEL:-1}
      - --batch-size
      - ${PERMISSION_CLASSIFIER_BATCH_SIZE:-512}
      - --ubatch-size
      - ${PERMISSION_CLASSIFIER_UBATCH_SIZE:-128}
      - --flash-attn
      - "on"
      - --cache-type-k
      - ${PERMISSION_CLASSIFIER_CACHE_TYPE:-q8_0}
      - --cache-type-v
      - ${PERMISSION_CLASSIFIER_CACHE_TYPE:-q8_0}
      - --no-mmap
    volumes:
      - ${MODELS_DIR:-/opt/llamacpp/models}:/models:ro
    ports:
      - "${PERMISSION_CLASSIFIER_PORT:-8083}:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${PERMISSION_CLASSIFIER_GPU:-3}"]
              capabilities: [gpu]

volumes:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: ${OCTOFAN_DOCKER_NETWORK:-octofan-ai}
