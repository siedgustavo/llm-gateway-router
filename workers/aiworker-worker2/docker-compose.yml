name: ollama

# Ollama backend for the aiworker node (system-architect). Owns both RTX 3090s.
# Loads models on demand; runs qwen3.6:35b (MoE) for architecture/complex tasks.
# Replaces the previous vLLM deployment. The live compose also lives at /opt/ollama.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      # Keep loaded models resident (no cold reloads between requests).
      OLLAMA_KEEP_ALIVE: "-1"
      # Worker + fast resident at the same time.
      OLLAMA_MAX_LOADED_MODELS: "2"
      # Agents need >=64k context.
      OLLAMA_CONTEXT_LENGTH: "65536"
      # Flash attention + quantized KV cache so 64k fits compactly (near-lossless).
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama:
