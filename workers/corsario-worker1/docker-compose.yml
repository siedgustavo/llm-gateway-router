name: ollama

# Ollama backend for the corsario worker (agile-coder-ops). Owns both RTX 3060s.
# Loads models on demand (incl. from Hugging Face via `ollama pull hf.co/...`).
# Replaces the previous vLLM deployment.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: corsario-ollama
    restart: unless-stopped
    ports:
      - "8000:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      # Keep loaded models resident (no cold reloads between requests).
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_MAX_LOADED_MODELS: "2"
      # Agents need a large context window.
      OLLAMA_CONTEXT_LENGTH: "49152"
      # Flash attention + quantized KV cache so the context fits compactly.
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD-SHELL
        - "ollama ps >/dev/null 2>&1 || exit 1"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  ollama:
