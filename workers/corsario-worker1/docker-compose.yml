services:
  vllm-coder-ops:
    image: vllm/vllm-openai:latest
    container_name: corsario-vllm-qwen3-coder-14b
    restart: unless-stopped
    ipc: host
    ports:
      - "8000:8000"
    environment:
      HF_HOME: ${HF_HOME:-/models/huggingface}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      HF_DATASETS_OFFLINE: ${HF_DATASETS_OFFLINE:-1}
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
      NCCL_DEBUG: WARN
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
    volumes:
      - ${HF_HOME_HOST:-/srv/models/huggingface}:${HF_HOME:-/models/huggingface}:ro
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --model
      - ${MODEL_ID:-Qwen/Qwen3-Coder-14B-Instruct}
      - --served-model-name
      - Qwen/Qwen3-Coder-14B-Instruct
      - --gpu-memory-utilization
      - "0.90"
      - --tensor-parallel-size
      - ${TENSOR_PARALLEL_SIZE:-2}
      - --max-model-len
      - ${MAX_MODEL_LEN:-32768}
      - --disable-log-requests
      - --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/models', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

