services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: llm-gateway-litellm
    restart: unless-stopped
    command:
      - --config
      - /app/config.yaml
      - --host
      - 0.0.0.0
      - --port
      - "4000"
      - --num_workers
      - "4"
    ports:
      - "4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-gateway-router}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-local-litellm-salt-change-me}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:-litellm-local-password}@postgres:5432/litellm
      STORE_MODEL_IN_DB: "true"
      UI_USERNAME: ${LITELLM_UI_USERNAME:-admin}
      UI_PASSWORD: ${LITELLM_UI_PASSWORD:-admin-local-change-me}
      NO_TELEMETRY: "true"
      OTEL_SDK_DISABLED: "true"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
      - ./callbacks.py:/app/callbacks.py:ro
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - ai-core

  auto-router:
    image: python:3.12-slim
    container_name: llm-gateway-auto-router
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      GATEWAY_URL: http://litellm:4000
      GATEWAY_KEY: ${LITELLM_MASTER_KEY:-sk-local-gateway-router}
    volumes:
      - ./auto_router.py:/app/auto_router.py:ro
    working_dir: /app
    command:
      - sh
      - -c
      - "pip install --no-cache-dir fastapi uvicorn httpx >/dev/null 2>&1 && uvicorn auto_router:app --host 0.0.0.0 --port 4001"
    depends_on:
      - litellm
    networks:
      - ai-core

  qdrant:
    image: qdrant/qdrant:latest
    container_name: llm-gateway-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - ai-core

  postgres:
    image: postgres:16-alpine
    container_name: llm-gateway-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm-local-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ai-core

  redis:
    image: redis:7-alpine
    container_name: llm-gateway-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ai-core

  ollama-memory:
    image: ollama/ollama:latest
    container_name: llm-gateway-ollama-memory
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      # Resident: bge-m3 (embeddings) + qwen3:0.6b (semantic-classifier).
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
      NVIDIA_VISIBLE_DEVICES: ${OLLAMA_MEMORY_NVIDIA_VISIBLE_DEVICES:-all}
    volumes:
      - ollama-memory-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - ai-core

  memory-mcp:
    build:
      context: ../mcp
      dockerfile: Dockerfile
    container_name: llm-gateway-memory-mcp
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      MEMORY_QDRANT_URL: http://qdrant:6333
      MEMORY_QDRANT_COLLECTION: mem0_mcp_selfhosted
      MEMORY_OLLAMA_URL: http://ollama-memory:11434
      MEMORY_EMBED_MODEL: bge-m3
      MEMORY_VECTOR_SIZE: "1024"
      MEMORY_USER_ID: gustavo
    depends_on:
      qdrant:
        condition: service_started
      ollama-memory:
        condition: service_started
    networks:
      - ai-core

volumes:
  qdrant-data:
  postgres-data:
  redis-data:
  ollama-memory-data:

networks:
  ai-core:
    name: llm-gateway-router
