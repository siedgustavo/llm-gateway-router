model_list:
  - model_name: agile-coder-ops
    litellm_params:
      model: openai/llama3.1-fast
      api_base: http://corsario.core.sied.ar:8000/v1
      api_key: local-vllm
      timeout: 180
      stream_timeout: 180

  - model_name: system-architect
    litellm_params:
      model: ollama_chat/llama3.3:70b-instruct-q3_K_M
      api_base: http://aiworker.core.sied.ar:11434
      think: false
      timeout: 420
      stream_timeout: 420

  - model_name: semantic-classifier
    litellm_params:
      model: openai/semantic-classifier
      api_base: http://airouter.core.sied.ar:8000/v1
      api_key: local-vllm
      timeout: 60
      stream_timeout: 60

  - model_name: bge-m3
    litellm_params:
      model: ollama/bge-m3:latest
      api_base: http://ollama-memory:11434
      timeout: 60

litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 420
  telemetry: false
  success_callback: []
  failure_callback: []
  num_retries: 2
  allowed_fails: 3
  cooldown_time: 30
  routing_strategy: latency-based-routing
  redis_host: redis
  redis_port: 6379
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    namespace: litellm
    ttl: 3600

router_settings:
  routing_strategy: latency-based-routing
  redis_host: redis
  redis_port: 6379
  allowed_fails: 3
  cooldown_time: 30
  num_retries: 2
  timeout: 420

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  disable_spend_logs: false
