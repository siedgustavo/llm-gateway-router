model_list:
  # Los backends de las RTX 3090 siguen fuera del cluster hasta incorporar su worker.
  # Mientras tanto, una unica instancia de Ollama en octoserver sirve esos modelos por :11434.
  # llama3.1:8b corre en el cluster sobre gpu-worker2 y se declara mas abajo.
  #
  # Coding/ops -> Qwen3 Coder Next 79.7B MoE Q4_K_M en Ollama.
  - model_name: agile-coder-ops
    litellm_params:
      model: ollama_chat/qwen3-coder-next:80b
      api_base: http://octoserver.core.sied.ar:11434
      think: false
      max_tokens: 32768
      timeout: 900
      stream_timeout: 900
    model_info:
      max_input_tokens: 262144
      max_output_tokens: 32768

  # General/arquitectura -> qwen3.6 uncensored GGUF en la misma instancia de Ollama.
  - model_name: system-architect
    litellm_params:
      model: ollama_chat/qwen3.6:35b
      api_base: http://octoserver.core.sied.ar:11434
      think: false
      max_tokens: 16384
      timeout: 420
      stream_timeout: 420
    model_info:
      max_input_tokens: 131072
      max_output_tokens: 16384

  - model_name: semantic-classifier
    litellm_params:
      model: ollama_chat/llama3.2:3b
      api_base: http://ollama-memory:11434
      format: json
      timeout: 60
      stream_timeout: 60

  # Coder Next 79.7B MoE Q4_K_M: tag estable por cantidad de parametros,
  # contexto nativo completo y offload CPU/GPU
  # sobre las dos RTX 3090 de octoserver.
  - model_name: qwen3-coder-next:80b
    litellm_params:
      model: ollama_chat/qwen3-coder-next:80b
      api_base: http://octoserver.core.sied.ar:11434
      think: false
      max_tokens: 32768
      timeout: 900
      stream_timeout: 900
    model_info:
      max_input_tokens: 262144
      max_output_tokens: 32768

  - model_name: qwen3.6:35b
    litellm_params:
      model: ollama_chat/qwen3.6:35b
      api_base: http://octoserver.core.sied.ar:11434
      think: false
      max_tokens: 16384
      timeout: 420
      stream_timeout: 420
    model_info:
      max_input_tokens: 131072
      max_output_tokens: 16384

  # Qwen3.6-Fable 26.9B denso Q8_0: contexto nativo de 262144 verificado con
  # el num_ctx del propio modelo en Ollama -- carga completo en VRAM repartido
  # entre las dos RTX 3090 (38.2GB asignados al proceso, sin offload a CPU).
  # Capacidades declaradas por Ollama: completion y vision. Alias explicito para
  # que los clientes vean los limites reales en
  # vez de depender del wildcard octoserver/* (que no publica model_info).
  - model_name: qwen36-fable:q8_0
    litellm_params:
      model: ollama_chat/qwen36-fable:q8_0
      api_base: http://octoserver.core.sied.ar:11434
      think: false
      max_tokens: 32768
      timeout: 900
      stream_timeout: 900
    model_info:
      max_input_tokens: 262144
      max_output_tokens: 32768

  # Redaccion larga para sied-poster. La cuantizacion IQ2_S corre con una
  # ventana de 32K: el pipeline limita la fuente a 8K caracteres y genera
  # articulos de hasta 1500 palabras, por lo que priorizamos calidad y VRAM.
  - model_name: mistral-medium-3.5:128b
    litellm_params:
      model: ollama_chat/mistral-medium-3.5:128b
      api_base: http://octoserver.core.sied.ar:11434
      think: false
      max_tokens: 4096
      timeout: 900
      stream_timeout: 900
    model_info:
      max_input_tokens: 32768
      max_output_tokens: 4096

  # Descubrimiento nativo de todos los modelos instalados en octoserver.
  # LiteLLM consulta /api/tags y los publica como octoserver/<modelo>;
  # los alias explicitos anteriores conservan limites de contexto y salida.
  - model_name: octoserver/*
    litellm_params:
      model: ollama_chat/*
      api_base: http://octoserver.core.sied.ar:11434
      think: false
      timeout: 900
      stream_timeout: 900
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0

  # Qwen3.8-Flash-Next 176B MoE UD-Q4_K_XL en llama.cpp nativo (octoserver:8091,
  # container qwen38flash). model debe matchear el --alias del servidor (verificado
  # via /v1/models). Soporta 262144 nativo y reasoning controlado por
  # chat_template_kwargs.reasoning_effort (el servidor trae medium por defecto).
  - model_name: qwen3.8-flash-next
    litellm_params:
      model: hosted_vllm/qwen3.8-flash-next
      api_base: http://octoserver.core.sied.ar:8091/v1
      api_key: local-llamacpp
      max_tokens: 32768
      timeout: 900
      stream_timeout: 900
    model_info:
      max_input_tokens: 262144
      max_output_tokens: 32768
      supports_reasoning: true

  - model_name: llama3.1:8b
    litellm_params:
      model: hosted_vllm/llama3.1:8b
      api_base: http://llamacpp-llama31-pro:8080/v1
      api_key: local-llamacpp
      # Este fine-tune 8B elige herramientas innecesarias incluso ante saludos.
      # Se publica como chat liviano, no como agente; los perfiles con tools usan
      # auto/qwen3-coder. callbacks.ProxyRequestSanitizer quita esos parametros
      # porque additional_drop_params no funciona en la version desplegada.
      max_tokens: 4096
      timeout: 120
      stream_timeout: 120
    model_info:
      max_input_tokens: 49152
      max_output_tokens: 4096

  # Ruteo automatico (auto-router in-cluster). Publica el menor contexto de sus
  # dos destinos para no exceder system-architect cuando el clasificador lo elige.
  - model_name: auto
    litellm_params:
      model: hosted_vllm/auto
      api_base: http://auto-router:4001/v1
      api_key: local-auto
      max_tokens: 16384
      timeout: 600
      stream_timeout: 600
    model_info:
      max_input_tokens: 131072
      max_output_tokens: 16384

  - model_name: bge-m3
    litellm_params:
      model: ollama/bge-m3:latest
      api_base: http://ollama-memory:11434
      timeout: 60

  # Clasificador de permisos de auto-mode 100% local (microservicio dedicado in-cluster).
  - model_name: permission-classifier
    litellm_params:
      model: hosted_vllm/permission-classifier
      api_base: http://permission-classifier-router:4002/v1
      api_key: local-permission-classifier
      timeout: 120
      stream_timeout: 120

  # Modelos Claude REALES de Anthropic (via OAuth de Claude Code, reenviado por LiteLLM).
  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      timeout: 600
      stream_timeout: 600

  - model_name: claude-opus-4-8
    litellm_params:
      model: anthropic/claude-opus-4-8
      timeout: 600
      stream_timeout: 600

litellm_settings:
  # permission_classifier_redirector: ver gateway/callbacks.py en el repo llm-gateway-router
  # para el estado (activado/desactivado) y el detalle del clasificador.
  callbacks: ["callbacks.proxy_handler_instance", "callbacks.permission_classifier_redirector", "callbacks.traffic_logger"]
  check_provider_endpoint: true
  drop_params: true
  set_verbose: false
  request_timeout: 420
  telemetry: false
  success_callback: []
  failure_callback: []
  num_retries: 2
  allowed_fails: 3
  cooldown_time: 30
  routing_strategy: latency-based-routing
  redis_host: redis
  redis_port: 6379
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    namespace: litellm
    ttl: 3600
  # Reenvia el header Authorization (OAuth de Claude Code) SOLO a los grupos Anthropic.
  model_group_settings:
    forward_client_headers_to_llm_api:
      - claude-sonnet-5
      - claude-opus-4-8

router_settings:
  routing_strategy: latency-based-routing
  redis_host: redis
  redis_port: 6379
  allowed_fails: 3
  cooldown_time: 30
  num_retries: 2
  timeout: 420
  context_window_fallbacks:
    - {"agile-coder-ops": ["system-architect"]}
    - {"qwen3-coder-next:80b": ["qwen3.6:35b"]}
    - {"llama3.1:8b": ["claude-sonnet-5"]}

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  disable_spend_logs: false
  forward_llm_provider_auth_headers: false
