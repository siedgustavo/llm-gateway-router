model_list:
  - model_name: agile-coder-ops
    litellm_params:
      model: ollama_chat/qwen3-coder:30b
      api_base: http://corsario.core.sied.ar:8000
      max_tokens: 14336
      timeout: 180
      stream_timeout: 180

  - model_name: system-architect
    litellm_params:
      model: openai/qwen3.6:35b
      api_base: http://aiworker.core.sied.ar:11434/v1
      api_key: local-ollama
      max_tokens: 16384
      timeout: 420
      stream_timeout: 420

  - model_name: semantic-classifier
    litellm_params:
      model: ollama_chat/qwen3:0.6b
      api_base: http://ollama-memory:11434
      think: false
      timeout: 60
      stream_timeout: 60

  # Nombres reales de modelo, expuestos para seleccion manual en clientes (qwen-code).
  # Apuntan a los mismos backends que los alias por rol de arriba.
  - model_name: qwen3-coder:30b
    litellm_params:
      model: ollama_chat/qwen3-coder:30b
      api_base: http://corsario.core.sied.ar:8000
      max_tokens: 14336
      timeout: 180
      stream_timeout: 180

  - model_name: qwen3.6:35b
    litellm_params:
      model: ollama_chat/qwen3.6:35b
      api_base: http://aiworker.core.sied.ar:11434
      max_tokens: 16384
      timeout: 420
      stream_timeout: 420

  # Ruteo automatico: delega en el auto-router (clasifica y reenvia al modelo destino).
  - model_name: auto
    litellm_params:
      model: openai/auto
      api_base: http://auto-router:4001/v1
      api_key: local-auto
      max_tokens: 16384
      timeout: 420
      stream_timeout: 420

  - model_name: bge-m3
    litellm_params:
      model: ollama/bge-m3:latest
      api_base: http://ollama-memory:11434
      timeout: 60

  # Modelos Claude REALES de Anthropic (via OAuth de Claude Code, reenviado por LiteLLM).
  # Usados como agente principal (Sonnet) y opcionalmente Opus. Nombres reales.
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      timeout: 600
      stream_timeout: 600

  - model_name: claude-opus-4-8
    litellm_params:
      model: anthropic/claude-opus-4-8
      timeout: 600
      stream_timeout: 600

litellm_settings:
  callbacks: ["callbacks.proxy_handler_instance", "callbacks.traffic_logger"]
  drop_params: true
  set_verbose: false
  request_timeout: 420
  telemetry: false
  success_callback: []
  failure_callback: []
  num_retries: 2
  allowed_fails: 3
  cooldown_time: 30
  routing_strategy: latency-based-routing
  redis_host: redis
  redis_port: 6379
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    namespace: litellm
    ttl: 3600
  # Reenvia el header Authorization (OAuth de Claude Code) SOLO a los grupos Anthropic,
  # para que Sonnet/Opus reales usen la suscripcion. Nunca a los modelos locales/Ollama.
  model_group_settings:
    forward_client_headers_to_llm_api:
      - claude-sonnet-4-6
      - claude-opus-4-8

router_settings:
  routing_strategy: latency-based-routing
  redis_host: redis
  redis_port: 6379
  allowed_fails: 3
  cooldown_time: 30
  num_retries: 2
  timeout: 420

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  disable_spend_logs: false
  # No BYOK: el OAuth de Claude Code viaja como header reenviado (arriba), no como provider key.
  forward_llm_provider_auth_headers: false
